name: Validate and bundle

# Every push and pull request: repair the tables' mechanical defects
# (tools/fix_tables.py), validate the repository, and check that the bundle
# builds. On pushes to main the repairs are committed back, whether or not
# validation passes, so a missing trailing comma never has to be fixed by hand;
# bundle.json is regenerated and committed only when validation passes.
# The repairs include deleting a decks/<period>/Staples.ydk identical to the
# collection already in force, since later periods inherit it.
# A push made with GITHUB_TOKEN does not trigger workflows again.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'bundle.json'
  pull_request:
    paths-ignore:
      - 'bundle.json'
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Repair mechanical defects in the tables
        run: python3 tools/fix_tables.py

      - name: Fetch the current SFFR list
        continue-on-error: true
        run: |
          curl -sSfL --retry 3 --max-time 60 \
            -o "$RUNNER_TEMP/sffr.lflist.conf" \
            https://raw.githubusercontent.com/XGlitchy30/StungrayFluteCustoms/main/lflists/sffr.lflist.conf
          head -n 1 "$RUNNER_TEMP/sffr.lflist.conf"

      - name: Validate the repository
        id: validate
        continue-on-error: true
        run: |
          ARGS=""
          if [ -f "$RUNNER_TEMP/sffr.lflist.conf" ]; then
            ARGS="--live-lflist $RUNNER_TEMP/sffr.lflist.conf"
          else
            echo "::warning title=Passcode checks skipped::the current SFFR list could not be fetched"
          fi
          python3 tools/validate_meta.py --json validation.json $ARGS

      - name: Build the bundle
        if: steps.validate.outcome == 'success'
        run: python3 tools/build_bundle.py --out bundle.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: validation.json
          if-no-files-found: ignore

      - name: Commit repairs and the regenerated bundle
        if: env.PUBLISH == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- '*.csv' '*.md' 'decks/'
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            git add bundle.json
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          FIXED=$(git diff --cached --name-only -- '*.csv' '*.md' 'decks/' | tr '\n' ' ')
          MSG="Regenerate bundle.json for ${GITHUB_SHA:0:7}"
          if [ -n "$FIXED" ]; then
            MSG="Auto-fix ${FIXED% }"
            git diff --cached --quiet -- bundle.json || MSG="$MSG; regenerate bundle.json"
            MSG="$MSG for ${GITHUB_SHA:0:7}"
          fi
          git commit -m "$MSG"
          for attempt in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((attempt * 5))
          done
          echo "::error title=Push failed::could not push the repairs after three attempts"
          exit 1

      - name: Fail if validation failed
        if: steps.validate.outcome != 'success'
        run: |
          echo "::error title=Validation failed::see the validation step; mechanical repairs (if any) were still committed"
          exit 1
